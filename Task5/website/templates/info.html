{% extends 'master.html' %}

{% load static %}

{% block content %}

<style>

    /* City Container */

    .laptop-container {
        min-height: 300px;

        display: flex;

        justify-content: center;
        align-items: center;

        gap: 25px;

        padding: 30px 20px;

        flex-wrap: wrap;
    }


    /* City Card */

    .laptop {
        width: 160px;
        height: 250px;

        padding: 15px;

        text-align: center;

        box-sizing: border-box;

        border-radius: 12px;

        background-color: white;

        transition: 0.3s;
    }


    /* Hover Effect */

    .laptop:hover {
        transform: translateY(-8px);

        box-shadow: 0 0 15px currentColor;
    }


    /* Image Area */

    .laptop-image {
        width: 100%;
        height: 190px;

        display: flex;

        justify-content: center;
        align-items: center;

        background-color: white;

        border-radius: 8px;

        overflow: hidden;
    }


    /* City Image */

    .laptop-image img {
        width: 100%;
        height: 100%;

        object-fit: contain;
    }


    /* City Name */

    .laptop h3 {
        margin: 12px 0 0 0;

        font-size: 16px;

        font-family: Arial, Helvetica, sans-serif;
    }


    /* Bhopal */

    .laptop:nth-child(1) {
        border: 3px solid #00ffff;

        background-color: #eaffff;

        box-shadow: 0 0 8px #00ffff;

        color: #008b8b;
    }


    .laptop:nth-child(1) h3 {
        color: #008b8b;
    }


    /* Delhi */

    .laptop:nth-child(2) {
        border: 3px solid #ff69b4;

        background-color: #fff0f6;

        box-shadow: 0 0 8px #ff69b4;

        color: #d63384;
    }


    .laptop:nth-child(2) h3 {
        color: #d63384;
    }


    /* Mumbai */

    .laptop:nth-child(3) {
        border: 3px solid #39ff14;

        background-color: #f0fff0;

        box-shadow: 0 0 8px #39ff14;

        color: #228b22;
    }


    .laptop:nth-child(3) h3 {
        color: #228b22;
    }


    /* Jaipur */

    .laptop:nth-child(4) {
        border: 3px solid #bf5fff;

        background-color: #faf0ff;

        box-shadow: 0 0 8px #bf5fff;

        color: #8a2be2;
    }


    .laptop:nth-child(4) h3 {
        color: #8a2be2;
    }


    /* Tablet Screen */

    @media (max-width: 750px) {

        .laptop-container {
            gap: 20px;
        }

        .laptop {
            width: 150px;
            height: 240px;
        }

        .laptop-image {
            height: 180px;
        }

    }


    /* Mobile Screen */

    @media (max-width: 450px) {

        .laptop-container {
            flex-direction: column;
        }

        .laptop {
            width: 180px;
            height: 260px;
        }

        .laptop-image {
            height: 200px;
        }

    }

</style>

<!-- City Section -->

<div class="laptop-container">

```
<!-- Bhopal -->

<div class="laptop">

    <div class="laptop-image">

        <img src="{% static 'bhopal.jpg' %}"
             alt="Bhopal">

    </div>

    <h3>Bhopal</h3>

</div>


<!-- Delhi -->

<div class="laptop">

    <div class="laptop-image">

        <img src="{% static 'delhi.jpg' %}"
             alt="Delhi">

    </div>

    <h3>Delhi</h3>

</div>


<!-- Mumbai -->

<div class="laptop">

    <div class="laptop-image">

        <img src="{% static 'mumbai.jpg' %}"
             alt="Mumbai">

    </div>

    <h3>Mumbai</h3>

</div>


<!-- Jaipur -->

<div class="laptop">

    <div class="laptop-image">

        <img src="{% static 'jaipur.jpg' %}"
             alt="Jaipur">

    </div>

    <h3>Jaipur</h3>

</div>
```

</div>

{% endblock %}
