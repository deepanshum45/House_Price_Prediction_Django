<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Classification - Home</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 24px;
            font-size: 1.75rem;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="number"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .submit-btn {
            grid-column: span 2;
            margin-top: 12px;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: var(--primary-hover);
        }

        @media (max-width: 480px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .submit-btn {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Placement Predictor</h1>

        <form action="{% url 'result' %}" method="get">
            {% csrf_token %}
            
            <div class="form-grid">
                <div class="form-group">
                    <label for="cgpa">CGPA:</label>
                    <input type="text" id="cgpa" required name="cgpa" placeholder="e.g. 1.518">
                </div>

                <div class="form-group">
                    <label for="iq">IQ:</label>
                    <input type="text" id="iq" required name="iq" placeholder="e.g. 13.64">
                </div>

                <div class="form-group">
                    <label for="profile_score">Profile Score:</label>
                    <input type="text" id="profile_score" required name="profile_score" placeholder="e.g. 4.49">
                </div>

                <button type="submit" class="submit-btn">Predict Selection Type</button>
            </div>
        </form>
    </div>

</body>
</html>
