<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Classification Result</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            padding: 32px;
            border: 1px solid var(--border-color);
        }

        .header-section h1 {
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.75rem;
            text-align: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 16px;
        }

        .info-card {
            background-color: #f1f5f9;
            border-left: 4px solid var(--primary-color);
            padding: 16px;
            border-radius: 4px;
            margin: 20px 0;
        }

        .info-card h2 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-main);
            word-break: break-word;
        }

        .result-card h2 {
            font-size: 1.3rem;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .result-text {
            color: #059669;
            font-weight: 700;
        }

        .legend-box {
            background-color: #fafafa;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }

        .legend-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .legend-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .legend-list li {
            padding: 6px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .legend-list li:last-child {
            border-bottom: none;
        }

        .legend-list span.class-num {
            display: inline-block;
            width: 24px;
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>


    <div class="container">
        <div class="header-section">
            <h1>Result Page</h1>
        </div>

        <div class="info-card">
            <h2>Value Entered: <span>{{lis}}</span></h2>
        </div>

        <div class="result-card">
            <h2>
                The Result is: 
                {% if ans == 0 %}
                    <span class="result-text">Keep Try! You are Unplaced....</span>
                {% elif ans == 1 %}
                    <span class="result-text">Congratulations!  You are Place.....</span>
                {% else %}
                    <span class="result-text">{{ ans }} (Unknown Type)</span>
                {% endif %}
            </h2>
        </div>

        <div class="legend-box">
            <div class="legend-title">selection:</div>
            <ul class="legend-list">
                <li><span class="class-num">1</span> unplaced</li>
                <li><span class="class-num">0</span> placed</li>
            </ul>
        </div>
    </div>

</body>
</html>
