<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS Login</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101820;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px;
            color: #39ff14;
            text-shadow: 0 0 10px #39ff14;
        }

        main {
            margin-top: 50px;
        }

        .box {
            display: inline-block;
            padding: 35px;
            border: 1px solid #39ff14;
            border-radius: 12px;
            box-shadow: 0 0 12px #8a2be2;
        }

        input {
            display: block;
            width: 230px;
            padding: 10px;
            margin: 15px auto;
            background: transparent;
            color: white;
            border: 1px solid #39ff14;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px #8a2be2;
        }

        button {
            padding: 10px 30px;
            margin: 15px;
            border: 1px solid #39ff14;
            border-radius: 7px;
            background: transparent;
            color: #39ff14;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #39ff14;
            color: #101820;
            box-shadow: 0 0 15px #8a2be2;
        }

        a {
            color: #39ff14;
        }
    </style>
</head>

<body>

<header>
    <h1>SPP Login</h1>
</header>

<main>
    <section class="box">

        <h2>Login</h2>

        <form action="{% url 'spp' %}" method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Login</button>
        </form>

        <p>
            Don't have an account?
            <a href="{% url 'register' %}">Registration</a>
        </p>

    </section>
</main>

</body>
</html>
