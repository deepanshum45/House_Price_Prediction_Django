<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee List</title>
</head>
<body>
    <div>
        <h1>Employee List</h1>
        <table>
            <tr>
                <th>ID:</th>
                <th>Employee No.</th>
                <th>Employee Name</th>
                <th>Employee Salary</th>
            </tr>
            {% for i in employees %}
            <tr>
                <td><a href="http://localhost:8000/database/updateEmployeeform/?id={{i.id}}">{{i.id}}</a></td>
                <td>{{ i.eno }}</td>
                <td>{{ i.ename }}</td>
                <td>{{ i.esal }}</td>
                <td><a href="http://localhost:8000/database/deleteEmployee/?id={{i.id}}">Delete</a></td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
