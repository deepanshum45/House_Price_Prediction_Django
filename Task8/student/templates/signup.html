<!DOCTYPE html> 

<html lang="en"> 

<head> 

<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 

<title>Signup Page</title> 

<style> 

    body { 
        margin: 0; 
        padding: 0; 
        font-family: Arial, sans-serif; 

        background-color: #101820; 
        color: white; 
    } 

    .signup-container { 
        width: 350px; 

        margin: 80px auto; 
        padding: 30px; 

        background-color: #17232e; 

        border: 2px solid #00e5ff; 
        border-radius: 12px; 

        box-shadow: 0 0 15px #00e5ff; 
    } 

    h1 { 
        text-align: center; 
        color: #00e5ff; 

        margin-bottom: 30px; 

        text-shadow: 0 0 8px #00e5ff; 
    } 

    .form-group { 
        margin-bottom: 20px; 
    } 

    label { 
        display: block; 

        margin-bottom: 8px; 

        color: #7fffd4; 

        font-weight: bold; 
    } 

    input[type="text"], 
    input[type="password"] { 
        width: 100%; 

        padding: 11px; 

        box-sizing: border-box; 

        background-color: #101820; 

        color: white; 

        border: 1px solid #7fffd4; 

        border-radius: 5px; 

        outline: none; 
    } 

    input[type="text"]:focus, 
    input[type="password"]:focus { 
        border-color: #00e5ff; 

        box-shadow: 0 0 8px #00e5ff; 
    } 

    input[type="submit"] { 
        width: 100%; 

        padding: 12px; 

        background-color: #00e5ff; 

        color: #101820; 

        border: none; 

        border-radius: 5px; 

        font-size: 16px; 

        font-weight: bold; 

        cursor: pointer; 
    } 

    input[type="submit"]:hover { 
        background-color: #7fffd4; 

        color: #101820; 

        box-shadow: 0 0 10px #7fffd4; 
    } 

    .error { 
        display: block; 

        margin-top: 8px; 

        color: #ff6b6b; 

        font-size: 14px; 
    } 

</style> 
```

</head> 

<body> 

```
<div class="signup-container"> 

    <h1>Signup Page</h1> 


    <form action="{% url 'saveuser' %}" method="post"> 

        {% csrf_token %} 


        <div class="form-group"> 

            <label for="username"> 
                Username: 
            </label> 

            <input 
                type="text" 
                name="username" 
                id="username" 
                required 
            > 

            <span class="error"> 
                {{ errormessage }} 
            </span> 

        </div> 


        <div class="form-group"> 

            <label for="password"> 
                Password: 
            </label> 

            <input 
                type="password" 
                name="password" 
                id="password" 
                required 
            > 

        </div> 


        <div class="form-group"> 

            <label for="name"> 
                Name: 
            </label> 

            <input 
                type="text" 
                name="name" 
                id="name" 
                required 
            > 

        </div> 


        <div> 

            <input 
                type="submit" 
                value="Sign-Up" 
            > 

        </div> 

    </form> 

</div> 


</body> 

</html>
