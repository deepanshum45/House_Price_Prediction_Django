<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS Signup</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #160b16;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px;
            color: #ff4da6;
            text-shadow: 0 0 10px #ff4da6;
        }

        main {
            margin-top: 40px;
        }

        .box {
            display: inline-block;
            padding: 35px;
            border: 1px solid #ff4da6;
            border-radius: 12px;
            box-shadow: 0 0 12px #dc143c;
        }

        input {
            display: block;
            width: 230px;
            padding: 10px;
            margin: 15px auto;
            background: transparent;
            color: white;
            border: 1px solid #ff4da6;
            border-radius: 6px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 10px #dc143c;
        }

        button {
            padding: 10px 30px;
            margin: 15px;
            border: 1px solid #ff4da6;
            border-radius: 7px;
            background: transparent;
            color: #ff4da6;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #ff4da6;
            color: #160b16;
            box-shadow: 0 0 15px #dc143c;
        }

        a {
            color: #ff4da6;
        }
    </style>
</head>

<body>

<header>
    <h1>OTS Signup</h1>
</header>

<main>
    <section class="box">

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Signup</button>
        </form>

        <p>
            Already have an account?
            <a href="{% url 'login' %}">Login</a>
        </p>

    </section>
</main>

</body>
</html>
