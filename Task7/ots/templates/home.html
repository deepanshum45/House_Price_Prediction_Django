<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0d1117;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px;
            color: #00e5ff;
            text-shadow: 0 0 10px #00e5ff;
        }

        main {
            margin-top: 80px;
        }

        .box {
            display: inline-block;
            padding: 35px;
            border: 1px solid #00e5ff;
            border-radius: 12px;
            box-shadow: 0 0 12px #dc143c;
        }

        button {
            padding: 10px 25px;
            margin: 10px;
            border: 1px solid #00e5ff;
            border-radius: 7px;
            background: transparent;
            color: #00e5ff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00e5ff;
            color: #0d1117;
            box-shadow: 0 0 15px #dc143c;
            transform: scale(1.05);
        }

        a {
            text-decoration: none;
        }

        footer {
            margin-top: 80px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>OTS - Online Testing System</h1>
</header>

<main>
    <section class="box">
        <h2>Welcome to OTS</h2>
        <p>Test your knowledge with online tests.</p>

        <a href="{% url 'login' %}">
            <button type="button">Login</button>
        </a>

        <a href="{% url 'signup' %}">
            <button type="button">Signup</button>
        </a>
    </section>
</main>

<footer>
    <p>OTS - Online Testing System</p>
</footer>

</body>
</html>
