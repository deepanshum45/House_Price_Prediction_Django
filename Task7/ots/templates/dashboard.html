<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1020;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px;
            color: #4da6ff;
            text-shadow: 0 0 10px #4da6ff;
        }

        main {
            margin-top: 30px;
        }

        .box {
            display: inline-block;
            padding: 35px;
            border: 1px solid #4da6ff;
            border-radius: 12px;
            box-shadow: 0 0 12px #8a2be2;
        }

        button {
            width: 240px;
            padding: 11px;
            margin: 8px;
            border: 1px solid #4da6ff;
            border-radius: 7px;
            background: transparent;
            color: #4da6ff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4da6ff;
            color: #0b1020;
            box-shadow: 0 0 15px #8a2be2;
            transform: scale(1.03);
        }

        a {
            text-decoration: none;
        }

        footer {
            margin-top: 70px;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <h1>OTS - Online Testing System</h1>
</header>

<main>

    <section class="box">

        <h2>Welcome to OTS</h2>
        <p>Select a test:</p>

        <a href="{% url 'test1' %}">
            <button type="button">Test of 1 Question</button>
        </a>

        <br>

        <a href="{% url 'test3' %}">
            <button type="button">Test of 3 Questions</button>
        </a>

        <br>

        <a href="{% url 'test5' %}">
            <button type="button">Test of 5 Questions</button>
        </a>

        <br>

        <a href="{% url 'history' %}">
            <button type="button">Test History</button>
        </a>

    </section>

</main>

<footer>
    <p>OTS - Online Testing System</p>
</footer>

</body>
</html>
