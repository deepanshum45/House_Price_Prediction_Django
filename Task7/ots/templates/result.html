<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #110d18;
            color: white;
            text-align: center;
        }

        header {
            padding: 30px;
            color: #b66cff;
            text-shadow: 0 0 10px #b66cff;
        }

        main {
            margin-top: 60px;
        }

        .result-box {
            display: inline-block;
            padding: 35px;
            border: 1px solid #b66cff;
            border-radius: 12px;
            box-shadow: 0 0 15px #dc143c;
        }

        .score {
            font-size: 28px;
            color: #b66cff;
            text-shadow: 0 0 8px #b66cff;
        }

        button {
            padding: 10px 25px;
            margin: 10px;
            border: 1px solid #b66cff;
            border-radius: 7px;
            background: transparent;
            color: #b66cff;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #b66cff;
            color: #110d18;
            box-shadow: 0 0 15px #dc143c;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>OTS - Test Result</h1>
</header>

<main>

    <section class="result-box">

        <h2>Your Result</h2>

        <p class="score">
            Score: {{ score }} / {{ total }}
        </p>

        {% if score == total %}
            <p>All Answers Correct!</p>
        {% else %}
            <p>Test Completed!</p>
        {% endif %}

        <br>

        <a href="{% url 'dashboard' %}">
            <button type="button">Back to Dashboard</button>
        </a>

        <br>

        <a href="{% url 'history' %}">
            <button type="button">View Test History</button>
        </a>

    </section>

</main>

</body>
</html>
