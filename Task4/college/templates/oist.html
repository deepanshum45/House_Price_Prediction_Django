<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OIST Page</title>
<link rel="stylesheet" href="{% static 'mycss.css' %}">

<style>

    body {
        margin: 0;
        padding: 0;
        background-color: #f0fdf4;
        font-family: Arial, sans-serif;
    }

    .main {
        width: 90%;
        height: 320px;
        border: 3px solid #166534;
        margin: 15px auto;
        background-color: white;
        border-radius: 10px;
    }

    .menu {
        display: flex;
        gap: 20px;
        margin: 30px 20px;
    }

    .menu button {
        width: 90px;
        height: 48px;
        font-size: 14px;
        font-weight: bold;
        border-radius: 6px;
        cursor: pointer;
    }

    /* Home - Blue */
    .menu a:nth-child(1) button {
        background-color: #e0f2fe;
        border: 2px solid #0284c7;
        color: #075985;
    }

    /* SISTec - Green */
    .menu a:nth-child(2) button {
        background-color: #dcfce7;
        border: 2px solid #16a34a;
        color: #166534;
    }

    /* LNCT - Orange */
    .menu a:nth-child(3) button {
        background-color: #ffedd5;
        border: 2px solid #ea580c;
        color: #9a3412;
    }

    /* OIST - Violet */
    .menu a:nth-child(4) button {
        background-color: #ede9fe;
        border: 2px solid #7c3aed;
        color: #5b21b6;
    }

    .menu button:hover {
        opacity: 0.75;
        transform: scale(1.05);
    }

    /* OIST Heading */
    .d1 {
        margin-top: 40px;
    }

    .c1 {
        text-align: center;
        border: 3px solid #7c3aed;
        background-color: #f5f3ff;
        color: #5b21b6;
        padding: 15px;
        margin: 20px;
        border-radius: 8px;
    }

    .c1:hover {
        background-color: #ede9fe;
    }

    a {
        text-decoration: none;
    }

</style>


</head>

<body>


<div class="main">

    <div class="menu">

        <a href="{% url 'home' %}">
            <button>Home</button>
        </a>

        <a href="{% url 'Sistec' %}">
            <button>SISTec</button>
        </a>

        <a href="{% url 'Lnct' %}">
            <button>LNCT</button>
        </a>

        <a href="{% url 'oist' %}">
            <button>OIST</button>
        </a>

    </div>

    <div class="d1">

        <a href="https://oriental.ac.in/">
            <h1 class="c1">
                OIST Page
            </h1>
        </a>

    </div>

</div>

</body>

</html>
